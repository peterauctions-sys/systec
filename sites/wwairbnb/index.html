<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wwairbnb - 预览页面</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    .card {
      max-width: 480px;
      text-align: center;
      padding: 40px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
    }
    p {
      color: #6e6e73;
      line-height: 1.6;
    }
    code {
      background: #f0f0f2;
      padding: 2px 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>wwairbnb 预览站点</h1>
    <p>这是客户 <code>wwairbnb</code> 的预览占位页面。</p>
    <p>请将客户提供的 <code>index.html</code>（以及相关的 css / js / images 等资源文件）上传替换到本文件夹 <code>sites/wwairbnb/</code> 中即可完成预览部署。</p>
  </div>
</body>
</html>
